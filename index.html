      <h1>Grupo AC: integrador de telecomunicaciones y seguridad electrónica en Guatemala</h1>
      <p>Videovigilancia, control de acceso, enlaces de conectividad y cableado estructurado, diseñados, instalados y soportados por el mismo equipo, en todo Guatemala.</p>
      <ul>
        <li>Videovigilancia: cámaras IP, analítica de video y monitoreo centralizado.</li>
        <li>Control de acceso: biometría, tarjetas y control de puertas o torniquetes.</li>
        <li>Enlaces: radioenlaces y fibra óptica para conectar sedes, bodegas y sucursales.</li>
        <li>Cableado estructurado: cableado de datos y eléctrico certificado.</li>
      </ul>
      <p>Escríbenos a info@grupo-ac.com.gt para agendar una visita de diagnóstico.</p>
